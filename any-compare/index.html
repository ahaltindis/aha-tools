<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Any Compare</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface-muted: #f8fafc;
  --border: #e2e8f0;
  --text: #1e293b;
  --text-muted: #94a3b8;
  --accent: #4f46e5;
  --accent-light: #eef2ff;
  --radius: 8px;
  --green: #10b981;
  --red: #ef4444;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── Header ── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px; height: 52px;
  display: flex; align-items: center; gap: 10px;
}
.header h1 { font-size: 16px; font-weight: 700; color: var(--accent); margin-right: auto; }

.btn {
  padding: 6px 13px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-size: 13px; font-family: inherit;
  cursor: pointer; white-space: nowrap; transition: background 0.12s;
}
.btn:hover { background: var(--bg); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-danger { color: var(--red); border-color: #fecaca; }
.btn-danger:hover { background: #fee2e2; }

/* ── Pages ── */
.pages-bar {
  position: sticky; top: 52px; z-index: 99;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 20px; display: flex; align-items: flex-end; gap: 2px; overflow-x: auto;
}
.page-tab {
  display: flex; align-items: center; gap: 2px; flex-shrink: 0;
  padding: 7px 10px 6px; border: none; border-bottom: 2px solid transparent;
  background: none; color: var(--text-muted); font-size: 13px; font-family: inherit;
  cursor: pointer; white-space: nowrap;
}
.page-tab:hover { color: var(--text); }
.page-tab.active { color: var(--accent); border-bottom-color: var(--accent); cursor: default; }
.page-name-input {
  border: none; background: transparent; color: inherit; font: inherit; font-weight: 600;
  padding: 1px 3px; border-radius: 4px; min-width: 4ch;
}
.page-name-input:focus { outline: none; background: var(--accent-light); }
.page-del-btn {
  border: none; background: none; color: var(--text-muted); font-size: 14px; line-height: 1;
  cursor: pointer; padding: 0 3px; border-radius: 3px;
}
.page-del-btn:hover { color: var(--red); }
.page-add-btn {
  flex-shrink: 0; border: none; background: none; color: var(--text-muted);
  font-size: 16px; line-height: 1; padding: 6px 10px; cursor: pointer;
}
.page-add-btn:hover { color: var(--accent); }

/* ── Board ── */
.board-wrap { padding: 20px; }

.cat-row {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); overflow: hidden; margin-bottom: 18px;
  transition: opacity 0.12s;
}
.cat-row.dragging { opacity: 0.35; }

.cat-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; background: var(--accent-light);
  border-bottom: 1px solid #dde4ff;
  transition: box-shadow 0.1s;
}
.cat-header.drag-over-top { box-shadow: inset 0 3px 0 var(--accent); }
.cat-header.drag-over-bottom { box-shadow: inset 0 -3px 0 var(--accent); }
.cat-drag-handle { color: var(--text-muted); font-size: 13px; user-select: none; flex-shrink: 0; cursor: grab; }
.cat-drag-handle:active { cursor: grabbing; }
.cat-name-input {
  flex: 1; min-width: 0; border: none; background: transparent;
  font-size: 14px; font-weight: 700; color: var(--accent); font-family: inherit;
  padding: 3px 5px; border-radius: 4px;
}
.cat-name-input:focus { outline: none; background: var(--surface); box-shadow: 0 0 0 2px rgba(79,70,229,0.15); }
.cat-count {
  background: var(--border); color: var(--text-muted);
  font-size: 11px; padding: 1px 7px; border-radius: 10px; flex-shrink: 0;
}

.cat-width { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.cat-width-btn {
  border: none; background: transparent; color: var(--text-muted); cursor: pointer;
  font-size: 10px; padding: 3px 5px; border-radius: 4px; line-height: 1;
}
.cat-width-btn:hover:not(:disabled) { color: var(--accent); background: var(--surface); }
.cat-width-btn:disabled { opacity: 0.3; cursor: default; }
.cat-width-val { font-size: 11px; color: var(--text-muted); min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }

.cat-strip { display: flex; gap: 12px; padding: 14px; overflow-x: auto; }

.model-card {
  flex: 0 0 220px; width: 220px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 10px;
  position: relative; transition: box-shadow 0.12s, border-color 0.12s, opacity 0.12s;
}
.model-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.07); border-color: #cbd5e1; }
.model-card.dragging { opacity: 0.35; }
.card-drag-handle {
  text-align: center; color: var(--text-muted); font-size: 11px; line-height: 1;
  padding-bottom: 5px; cursor: grab; user-select: none;
}
.card-drag-handle:active { cursor: grabbing; }
.model-card.drag-over-left { box-shadow: inset 3px 0 0 var(--accent); }
.model-card.drag-over-right { box-shadow: inset -3px 0 0 var(--accent); }

.model-del {
  position: absolute; top: 6px; right: 6px; border: none; background: transparent;
  color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 2px 5px;
  border-radius: 4px; opacity: 0; transition: opacity 0.12s, background 0.12s; line-height: 1;
}
.model-card:hover .model-del { opacity: 0.5; }
.model-del:hover { opacity: 1 !important; background: var(--bg); color: var(--red); }

.model-brand-input {
  width: 100%; border: none; background: transparent;
  font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-muted); font-family: inherit; padding: 2px 18px 0 2px;
}
.model-brand-input:focus { outline: none; color: var(--accent); }
.model-name-input {
  width: 100%; border: none; border-bottom: 1px solid var(--border); background: transparent;
  font-size: 14px; font-weight: 700; color: var(--text); font-family: inherit;
  padding: 0 2px 6px; margin-bottom: 8px;
}
.model-name-input:focus { outline: none; border-bottom-color: var(--accent); }

.model-image {
  width: 100%; height: 130px; border: 1px dashed var(--border); border-radius: 6px;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  background: var(--surface-muted); cursor: pointer; margin-bottom: 8px; position: relative;
}
.model-image:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,70,229,0.15); }
.model-image img { width: 100%; height: 100%; object-fit: contain; }
.model-image-placeholder { font-size: 11px; color: var(--text-muted); text-align: center; padding: 8px; line-height: 1.6; }
.model-image-upload-link { color: var(--accent); text-decoration: underline; cursor: pointer; }
.model-image-btns {
  position: absolute; top: 4px; right: 4px; display: flex; gap: 4px;
  opacity: 0; transition: opacity 0.12s;
}
.model-image:hover .model-image-btns { opacity: 1; }
.model-image-btn {
  border: none; background: rgba(15,23,42,0.55); color: #fff; width: 18px; height: 18px;
  border-radius: 50%; font-size: 11px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

.model-meta { margin-bottom: 8px; }
.meta-row { display: flex; gap: 4px; margin-bottom: 3px; }
.meta-key-input {
  width: 40%; font-size: 11px; border: none; background: var(--surface-muted);
  border-radius: 4px; padding: 3px 5px; font-family: inherit; color: var(--text-muted);
}
.meta-val-input {
  flex: 1; min-width: 0; font-size: 11px; border: none; background: var(--surface-muted);
  border-radius: 4px; padding: 3px 5px; font-family: inherit; color: var(--text);
}
.meta-key-input:focus, .meta-val-input:focus { outline: none; box-shadow: 0 0 0 1.5px var(--accent); }
.meta-del-btn { border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 12px; padding: 0 3px; }
.meta-del-btn:hover { color: var(--red); }
.meta-drag-handle {
  flex-shrink: 0; align-self: center; color: var(--text-muted); font-size: 10px; line-height: 1;
  cursor: grab; user-select: none; opacity: 0.35; transition: opacity 0.12s;
}
.meta-drag-handle:active { cursor: grabbing; }
.meta-row:hover .meta-drag-handle { opacity: 1; }
.meta-row.dragging { opacity: 0.35; }
.meta-row.drag-over-top { box-shadow: 0 -2px 0 var(--accent); }
.meta-row.drag-over-bottom { box-shadow: 0 2px 0 var(--accent); }
.meta-type-btn { border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 11px; padding: 0 2px; opacity: 0.6; }
.meta-type-btn:hover { color: var(--accent); opacity: 1; }
.meta-row.bool { border-radius: 4px; }
.meta-row.bool-yes { background: #ecfdf5; }
.meta-row.bool-no { background: #fef2f2; }
.meta-row.bool-yes .meta-key-input, .meta-row.bool-no .meta-key-input { background: transparent; }
.meta-row.bool .meta-key-input { flex: 1; width: auto; min-width: 0; }
.meta-bool-btn {
  flex: 0 0 auto; width: 24px; font-size: 11px; border: none; background: var(--surface-muted);
  border-radius: 4px; padding: 3px 5px; font-family: inherit; color: var(--text-muted);
  text-align: center; cursor: pointer;
}
.meta-row.bool-yes .meta-bool-btn { background: transparent; color: #047857; }
.meta-row.bool-no .meta-bool-btn { background: transparent; color: #b91c1c; }
.meta-add-btn {
  font-size: 11px; color: var(--accent); background: transparent; border: 1px dashed var(--border);
  border-radius: 4px; padding: 3px 6px; cursor: pointer; width: 100%; font-family: inherit;
}
.meta-add-btn:hover { background: var(--accent-light); border-color: var(--accent); }
.meta-add-row { display: flex; gap: 4px; }
.meta-add-row .meta-add-btn.sep { width: auto; flex-shrink: 0; }
.meta-row.sep { align-items: center; margin: 6px 0 4px; }
.meta-sep-line { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; }
.meta-sep-line::before, .meta-sep-line::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.meta-sep-input {
  flex: 0 1 auto; width: 8ch; min-width: 0; text-align: center; border: none; background: transparent;
  font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-muted); font-family: inherit; padding: 1px 2px; border-radius: 4px;
}
.meta-sep-input:focus { outline: none; box-shadow: 0 0 0 1.5px var(--accent); min-width: 8ch; }
.meta-sep-line.empty { gap: 0; cursor: text; }
.meta-sep-line.empty:focus-within { gap: 6px; }
.meta-sep-line.empty .meta-sep-input:not(:focus) { width: 0 !important; padding: 0; }

.model-prices { border-top: 1px solid var(--border); padding-top: 7px; margin-top: 2px; }
.price-entry { background: var(--surface-muted); border-radius: 4px; padding: 4px 5px; margin-bottom: 4px; }
.model-price-input {
  width: 100%; font-size: 13px; font-weight: 700; color: var(--text); border: none;
  background: transparent; font-family: inherit; padding: 2px 2px 3px;
}
.model-price-input:focus { outline: none; }
.model-source-row { display: flex; align-items: center; gap: 4px; }
.model-source-input {
  flex: 1; min-width: 0; font-size: 11px; color: var(--text-muted); border: none;
  background: transparent; font-family: inherit; padding: 2px;
}
.model-source-input:focus { outline: none; color: var(--text); }
.model-source-link { color: var(--accent); text-decoration: none; font-size: 12px; flex-shrink: 0; }
.price-add-btn {
  font-size: 11px; color: var(--accent); background: transparent; border: 1px dashed var(--border);
  border-radius: 4px; padding: 3px 6px; cursor: pointer; width: 100%; font-family: inherit;
}
.price-add-btn:hover { background: var(--accent-light); border-color: var(--accent); }

.add-model-card {
  flex: 0 0 90px; width: 90px; border: 1px dashed var(--border); border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center; color: var(--text-muted);
  font-size: 12px; cursor: pointer; text-align: center; padding: 8px;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.add-model-card:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }

.inline-add-cat { border: 1px dashed var(--border); border-radius: var(--radius); background: var(--surface); padding: 4px 6px; }
.inline-input {
  width: 100%; padding: 6px 8px; border: 1px solid transparent; border-radius: 6px;
  font-size: 13px; font-family: inherit; color: var(--text); background: transparent;
  transition: border-color 0.12s, background 0.12s;
}
.inline-input::placeholder { color: var(--text-muted); opacity: 0.6; }
.inline-input:hover::placeholder { opacity: 1; }
.inline-input:focus { outline: none; box-shadow: none; }

.board-empty {
  text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px;
}
.board-empty strong { display: block; font-size: 16px; margin-bottom: 6px; color: var(--text); }

@media (max-width: 600px) {
  .board-wrap { padding: 12px; }
  .header { padding: 0 12px; gap: 6px; }
  .pages-bar { padding: 0 12px; }
  .model-card { flex-basis: 180px; width: 180px; }
}
</style>
</head>
<body>

<header class="header">
  <h1>Any Compare</h1>
  <button class="btn btn-sm" id="btn-share">⇗ Share</button>
  <button class="btn btn-sm" id="btn-export">↓ Export</button>
  <button class="btn btn-sm" id="btn-import">↑ Import</button>
</header>

<nav class="pages-bar" id="pages-bar"></nav>

<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
// D holds every page; S is the active page, so board code only touches S.categories
let D = { pages: [], activeId: null };
let S = { categories: [] };

const uid = () => Math.random().toString(36).slice(2, 9);
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function isUrl(s) { return /^https?:\/\//i.test(s || ''); }

// ── Persistence ───────────────────────────────────────────────────────────────
const STORE_KEY = 'any-compare-v2';
// Single-board data from before pages; left in place, migrated on first load
const LEGACY_KEYS = ['any-compare-v1', 'appliance-compare-v1'];

function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(D)); }
  catch (e) { alert('Storage limit reached — try removing some images, or export your data as a backup.'); }
}
function hydrate() {
  try {
    const r = localStorage.getItem(STORE_KEY);
    if (r) D = JSON.parse(r);
  } catch (_) {}
  D.pages = Array.isArray(D.pages) ? D.pages : [];
  if (!D.pages.length) {
    let legacy = null;
    try {
      const r = LEGACY_KEYS.map(k => localStorage.getItem(k)).find(Boolean);
      if (r) legacy = JSON.parse(r);
    } catch (_) {}
    if (legacy?.categories?.length) addPage(nextPageName('Loaded'), legacy.categories);
    else addPage(nextPageName('Page'), []);
  }
  D.pages.forEach(p => { p.categories = p.categories || []; });
  selectPage(D.activeId);
}

// ── Pages ─────────────────────────────────────────────────────────────────────
// "<prefix> #N" with N one above the highest existing for that prefix
function nextPageName(prefix) {
  const re = new RegExp(`^${prefix} #(\\d+)$`);
  const max = D.pages.reduce((n, p) => Math.max(n, +(re.exec(p.name)?.[1] || 0)), 0);
  return `${prefix} #${max + 1}`;
}
function addPage(name, categories) {
  const page = { id: uid(), name, categories };
  D.pages.push(page);
  D.activeId = page.id;
  S = page;
  return page;
}
function selectPage(id) {
  S = D.pages.find(p => p.id === id) || D.pages[0];
  D.activeId = S.id;
}
function switchPage(id) {
  if (id === S.id) return;
  selectPage(id);
  persist(); render();
}
function newPage() {
  addPage(nextPageName('Page'), []);
  persist(); render();
  document.getElementById('inline-cat-input')?.focus();
}
function renamePage(id, input) {
  const page = D.pages.find(p => p.id === id);
  if (!page) return;
  const name = input.value.trim();
  if (!name) { input.value = page.name; return; }
  if (name === page.name) return;
  page.name = name;
  persist(); renderPages();
}
function deletePage(id) {
  const page = D.pages.find(p => p.id === id);
  if (!page || D.pages.length < 2) return;
  if (!confirm(`Delete page "${page.name}" and everything on it?`)) return;
  const idx = D.pages.indexOf(page);
  D.pages.splice(idx, 1);
  selectPage(D.pages[Math.max(0, idx - 1)].id);
  persist(); render();
}
function renderPages() {
  const canDelete = D.pages.length > 1;
  document.getElementById('pages-bar').innerHTML = D.pages.map(p => p.id === S.id
    ? `<div class="page-tab active">
        <input class="page-name-input" value="${esc(p.name)}" style="width:${p.name.length + 1}ch" title="Click to rename"
          oninput="this.style.width=(this.value.length+1)+'ch'"
          onblur="renamePage('${p.id}',this)" onkeydown="if(event.key==='Enter')this.blur()">
        ${canDelete ? `<button class="page-del-btn" onclick="deletePage('${p.id}')" title="Delete page">×</button>` : ''}
      </div>`
    : `<button class="page-tab" onclick="switchPage('${p.id}')">${esc(p.name)}</button>`
  ).join('') + `<button class="page-add-btn" onclick="newPage()" title="New page">+</button>`;
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  renderPages();
  const wrap = document.getElementById('board');
  const inlineCat = `<div class="inline-add-cat">
    <input class="inline-input" id="inline-cat-input" placeholder="Add category (e.g. Fridge)…" onkeydown="handleInlineCategory(event)">
  </div>`;

  if (!S.categories.length) {
    wrap.innerHTML = `<div class="board-empty"><strong>No categories yet</strong>Add one below to start comparing models.</div>${inlineCat}`;
    return;
  }

  // Re-rendering replaces the strips, so keep each category's horizontal scroll
  const scrolls = {};
  wrap.querySelectorAll('.cat-row').forEach(row => {
    scrolls[row.dataset.catId] = row.querySelector('.cat-strip')?.scrollLeft || 0;
  });
  wrap.innerHTML = S.categories.map(catRowHtml).join('') + inlineCat;
  wrap.querySelectorAll('.cat-row').forEach(row => {
    const strip = row.querySelector('.cat-strip');
    if (strip && scrolls[row.dataset.catId]) strip.scrollLeft = scrolls[row.dataset.catId];
  });
}

function catRowHtml(cat) {
  const models = cat.models || [];
  const width = cat.cardWidth || CARD_W_DEFAULT;
  return `<div class="cat-row" data-cat-id="${cat.id}">
    <div class="cat-header"
      ondragover="catHeaderDragOver(event)" ondragleave="catHeaderDragLeave(event)" ondrop="catHeaderDrop(event,'${cat.id}')">
      <span class="cat-drag-handle" draggable="true"
        ondragstart="catDragStart(event,'${cat.id}')" ondragend="dragEndCommon(event)" title="Drag to reorder">⋮⋮</span>
      <input class="cat-name-input" value="${esc(cat.name)}"
        onblur="renameCategory('${cat.id}',this)" onkeydown="if(event.key==='Enter')this.blur()">
      <span class="cat-count">${models.length}</span>
      <div class="cat-width" title="Model card width">
        <button class="cat-width-btn" draggable="false" onclick="changeCardWidth('${cat.id}',-1)" title="Narrower"${width <= CARD_W_MIN ? ' disabled' : ''}>◀</button>
        <span class="cat-width-val">${width}px</span>
        <button class="cat-width-btn" draggable="false" onclick="changeCardWidth('${cat.id}',1)" title="Wider"${width >= CARD_W_MAX ? ' disabled' : ''}>▶</button>
      </div>
      <button class="btn btn-sm btn-danger" draggable="false" onclick="deleteCategory('${cat.id}')">Delete</button>
    </div>
    <div class="cat-strip" ondragover="stripDragOver(event)" ondrop="stripDrop(event,'${cat.id}')">
      ${models.map(m => modelCardHtml(cat, m)).join('')}
      <div class="add-model-card" onclick="addModel('${cat.id}')">+ Add model</div>
    </div>
  </div>`;
}

function modelCardHtml(cat, m) {
  const catId = cat.id;
  // Only set inline when customised, so the mobile default from CSS still applies
  const widthStyle = cat.cardWidth ? ` style="flex-basis:${cat.cardWidth}px;width:${cat.cardWidth}px"` : '';
  const fields = cat.metaFields || [];
  const values = m.metaValues || {};
  const metaRows = fields.map(f => {
    const dragAttrs = `ondragover="metaRowDragOver(event,'${catId}')" ondragleave="metaRowDragLeave(event)" ondrop="metaRowDrop(event,'${catId}','${f.id}')"`;
    const handle = `<span class="meta-drag-handle" draggable="true"
      ondragstart="metaDragStart(event,'${catId}','${f.id}')" ondragend="dragEndCommon(event)" title="Drag to reorder">⋮⋮</span>`;
    if (f.type === 'sep') {
      return `<div class="meta-row sep" data-field-id="${f.id}" ${dragAttrs}>
    ${handle}
    <div class="meta-sep-line${f.key ? '' : ' empty'}" onclick="this.querySelector('input').focus()" title="${esc(f.key) || 'Click to add a label'}">
      <input class="meta-sep-input" draggable="false" value="${esc(f.key)}" title="${esc(f.key) || 'Click to add a label'}"
        style="width:${(f.key || '').length + 2}ch"
        onblur="updateMetaFieldKey('${catId}','${f.id}',this)" onkeydown="if(event.key==='Enter')this.blur()">
    </div>
    <button class="meta-del-btn" draggable="false" onclick="removeMetaField('${catId}','${f.id}')" title="Remove separator">×</button>
  </div>`;
    }
    const isBool = f.type === 'bool';
    const v = values[f.id];
    const boolCls = !isBool ? '' : v === true ? ' bool bool-yes' : v === false ? ' bool bool-no' : ' bool';
    const valueEl = isBool
      ? `<button class="meta-bool-btn" draggable="false" onclick="cycleMetaBool('${catId}','${m.id}','${f.id}')" title="Click to toggle Yes / No / unset">${v === true ? '✓' : v === false ? '✗' : '—'}</button>`
      : `<input class="meta-val-input" draggable="false" placeholder="Value" value="${esc(v ?? '')}"
      onblur="updateMetaValue('${catId}','${m.id}','${f.id}',this)" onkeydown="if(event.key==='Enter')this.blur()">`;
    return `<div class="meta-row${boolCls}" data-field-id="${f.id}" ${dragAttrs}>
    ${handle}
    <input class="meta-key-input" draggable="false" placeholder="Field" value="${esc(f.key)}" title="${esc(f.key)}"
      onblur="updateMetaFieldKey('${catId}','${f.id}',this)" onkeydown="if(event.key==='Enter')this.blur()">
    ${valueEl}
    <button class="meta-type-btn" draggable="false" onclick="toggleMetaFieldType('${catId}','${f.id}')" title="${isBool ? 'Switch to text field' : 'Switch to Yes/No field'}">${isBool ? 'Aa' : '✓✗'}</button>
    <button class="meta-del-btn" draggable="false" onclick="removeMetaField('${catId}','${f.id}')" title="Remove field from all models in this category">×</button>
  </div>`;
  }).join('');

  const imgInner = m.image
    ? `<img src="${m.image}" draggable="false">
       <div class="model-image-btns">
         <button class="model-image-btn" draggable="false" onclick="triggerImageUpload(event,'${catId}','${m.id}')" title="Replace image">⟳</button>
         <button class="model-image-btn" draggable="false" onclick="removeImage(event,'${catId}','${m.id}')" title="Remove image">×</button>
       </div>`
    : `<div class="model-image-placeholder">Click, then paste (Ctrl+V)<br>or <span class="model-image-upload-link" onclick="triggerImageUpload(event,'${catId}','${m.id}')">choose a file</span></div>`;

  const prices = m.prices || [];
  const priceRows = prices.map(p => `<div class="price-entry" data-price-id="${p.id}">
    <input class="model-price-input" draggable="false" placeholder="Price (e.g. 45.000 ₺)" value="${esc(p.price)}"
      onblur="updatePriceEntry('${catId}','${m.id}','${p.id}','price',this)" onkeydown="if(event.key==='Enter')this.blur()">
    <div class="model-source-row">
      <input class="model-source-input" draggable="false" placeholder="Source (site or store)" value="${esc(p.source)}"
        onblur="updatePriceEntry('${catId}','${m.id}','${p.id}','source',this)" onkeydown="if(event.key==='Enter')this.blur()">
      ${isUrl(p.source) ? `<a class="model-source-link" draggable="false" href="${esc(p.source)}" target="_blank" rel="noopener" title="Open link">↗</a>` : ''}
      <button class="meta-del-btn" draggable="false" onclick="removePriceEntry('${catId}','${m.id}','${p.id}')" title="Remove">×</button>
    </div>
  </div>`).join('');

  return `<div class="model-card" data-model-id="${m.id}"${widthStyle}
      ondragover="modelCardDragOver(event)" ondragleave="modelCardDragLeave(event)" ondrop="modelCardDrop(event,'${catId}','${m.id}')">
    <div class="card-drag-handle" draggable="true"
      ondragstart="modelDragStart(event,'${catId}','${m.id}')" ondragend="dragEndCommon(event)" title="Drag to reorder">⋮⋮</div>
    <button class="model-del" draggable="false" onclick="deleteModel('${catId}','${m.id}')" title="Delete model">×</button>
    <input class="model-brand-input" draggable="false" placeholder="Brand" value="${esc(m.brand)}"
      onblur="updateModelField('${catId}','${m.id}','brand',this)" onkeydown="if(event.key==='Enter')this.blur()">
    <input class="model-name-input" draggable="false" placeholder="Model" value="${esc(m.name)}"
      onblur="updateModelField('${catId}','${m.id}','name',this)" onkeydown="if(event.key==='Enter')this.blur()">
    <div class="model-image" draggable="false" tabindex="0" data-cat-id="${catId}" data-model-id="${m.id}"
      ondragover="event.preventDefault();event.stopPropagation()" ondrop="handleImageDrop(event,'${catId}','${m.id}')"
      title="Click to focus, then paste (Ctrl+V), or drag a file in">
      ${imgInner}
    </div>
    <div class="model-meta">
      ${metaRows}
      <div class="meta-add-row">
        <button class="meta-add-btn" draggable="false" onclick="addMetaField('${catId}')">+ Field</button>
        <button class="meta-add-btn sep" draggable="false" onclick="addMetaField('${catId}','sep')" title="Add separator">+ ―</button>
      </div>
    </div>
    <div class="model-prices">
      ${priceRows}
      <button class="price-add-btn" draggable="false" onclick="addPriceEntry('${catId}','${m.id}')">+ Price</button>
    </div>
  </div>`;
}

// ── Category CRUD ─────────────────────────────────────────────────────────────
function handleInlineCategory(e) {
  if (e.key === 'Enter') {
    const name = e.target.value.trim();
    if (!name) return;
    S.categories.push({ id: uid(), name, models: [] });
    persist(); render();
    document.getElementById('inline-cat-input')?.focus();
  } else if (e.key === 'Escape') {
    e.target.value = ''; e.target.blur();
  }
}
function renameCategory(catId, el) {
  const cat = S.categories.find(c => c.id === catId);
  if (!cat) return;
  const val = el.value.trim();
  if (!val) { el.value = cat.name; return; }
  if (cat.name === val) return;
  cat.name = val; persist();
}
const CARD_W_DEFAULT = 220, CARD_W_MIN = 160, CARD_W_MAX = 480, CARD_W_STEP = 20;
function changeCardWidth(catId, dir) {
  const cat = S.categories.find(c => c.id === catId);
  if (!cat) return;
  const w = Math.min(CARD_W_MAX, Math.max(CARD_W_MIN, (cat.cardWidth || CARD_W_DEFAULT) + dir * CARD_W_STEP));
  if (w === CARD_W_DEFAULT) delete cat.cardWidth; else cat.cardWidth = w;
  persist(); render();
}
function deleteCategory(catId) {
  if (!confirm('Delete this category and all its models?')) return;
  S.categories = S.categories.filter(c => c.id !== catId);
  persist(); render();
}

// ── Model CRUD ────────────────────────────────────────────────────────────────
function addModel(catId) {
  const cat = S.categories.find(c => c.id === catId);
  if (!cat) return;
  cat.models = cat.models || [];
  // Prefill field values from the rightmost model — similar models share most specs
  const last = cat.models[cat.models.length - 1];
  const metaValues = last ? { ...(last.metaValues || {}) } : {};
  cat.models.push({ id: uid(), brand: '', name: '', image: null, metaValues, prices: [] });
  persist(); render();
}
function deleteModel(catId, modelId) {
  if (!confirm('Delete this model?')) return;
  const cat = S.categories.find(c => c.id === catId);
  if (!cat) return;
  cat.models = cat.models.filter(m => m.id !== modelId);
  persist(); render();
}
function updateModelField(catId, modelId, field, el) {
  const cat = S.categories.find(c => c.id === catId);
  const model = cat?.models.find(m => m.id === modelId);
  if (!model) return;
  const val = el.value.trim();
  if (model[field] === val) return;
  model[field] = val;
  persist(); render();
}

// ── Metadata fields (shared schema per category) ──────────────────────────────
function addMetaField(catId, type) {
  const cat = S.categories.find(c => c.id === catId);
  if (!cat) return;
  cat.metaFields = cat.metaFields || [];
  const field = { id: uid(), key: '' };
  if (type) field.type = type;
  cat.metaFields.push(field);
  persist(); render();
  requestAnimationFrame(() => {
    document.querySelector(`.meta-row[data-field-id="${field.id}"] :is(.meta-key-input,.meta-sep-input)`)?.focus();
  });
}
function updateMetaFieldKey(catId, fieldId, el) {
  const cat = S.categories.find(c => c.id === catId);
  const field = cat?.metaFields.find(f => f.id === fieldId);
  if (!field) return;
  const val = el.value.trim();
  if (field.key === val) return;
  field.key = val;
  persist(); render();
}
function updateMetaValue(catId, modelId, fieldId, el) {
  const cat = S.categories.find(c => c.id === catId);
  const model = cat?.models.find(m => m.id === modelId);
  if (!model) return;
  model.metaValues = model.metaValues || {};
  const val = el.value.trim();
  if ((model.metaValues[fieldId] || '') === val) return;
  model.metaValues[fieldId] = val;
  persist();
}
// Switching type applies to the whole category (fields are a shared schema);
// existing values are converted so nothing obvious is lost.
const TRUE_WORDS = ['yes', 'y', 'true', '1', 'var', 'evet', '✓'];
const FALSE_WORDS = ['no', 'n', 'false', '0', 'yok', 'hayır', 'hayir', '✗'];
function toggleMetaFieldType(catId, fieldId) {
  const cat = S.categories.find(c => c.id === catId);
  const field = cat?.metaFields.find(f => f.id === fieldId);
  if (!field) return;
  const toBool = field.type !== 'bool';
  (cat.models || []).forEach(m => {
    const vals = m.metaValues || {};
    if (!(fieldId in vals)) return;
    const v = vals[fieldId];
    if (toBool) {
      const s = String(v).trim().toLowerCase();
      if (TRUE_WORDS.includes(s)) vals[fieldId] = true;
      else if (FALSE_WORDS.includes(s)) vals[fieldId] = false;
      else delete vals[fieldId];
    } else {
      vals[fieldId] = v === true ? 'Yes' : v === false ? 'No' : '';
    }
  });
  if (toBool) field.type = 'bool'; else delete field.type;
  persist(); render();
}
function cycleMetaBool(catId, modelId, fieldId) {
  const cat = S.categories.find(c => c.id === catId);
  const model = cat?.models.find(m => m.id === modelId);
  if (!model) return;
  model.metaValues = model.metaValues || {};
  const v = model.metaValues[fieldId];
  if (v === true) model.metaValues[fieldId] = false;
  else if (v === false) delete model.metaValues[fieldId];
  else model.metaValues[fieldId] = true;
  persist(); render();
}
function removeMetaField(catId, fieldId) {
  const cat = S.categories.find(c => c.id === catId);
  if (!cat) return;
  const field = cat.metaFields.find(f => f.id === fieldId);
  if (field?.type !== 'sep' && !confirm(`Remove field "${field?.key || '(untitled)'}" from all models in this category?`)) return;
  cat.metaFields = cat.metaFields.filter(f => f.id !== fieldId);
  (cat.models || []).forEach(m => { if (m.metaValues) delete m.metaValues[fieldId]; });
  persist(); render();
}

function updatePriceEntry(catId, modelId, priceId, field, el) {

// ── Image paste / drop / upload ───────────────────────────────────────────────
// Paste is handled at the document level (rather than an inline onpaste on the
// zone) because focusing the zone and then reading document.activeElement is
// more reliable across browsers than depending on the event to fire+bubble
// correctly from a plain non-editable div.
document.addEventListener('paste', e => {
  const zone = document.activeElement;
  if (!zone || !zone.classList.contains('model-image')) return;
  const items = e.clipboardData?.items || [];
  for (const it of items) {
    if (it.type.startsWith('image/')) {
      e.preventDefault();
      const file = it.getAsFile();
      if (file) readImageFile(file, zone.dataset.catId, zone.dataset.modelId);
      return;
    }
  }
});
function handleImageDrop(e, catId, modelId) {
  e.preventDefault(); e.stopPropagation();
  const file = e.dataTransfer.files?.[0];
  if (file && file.type.startsWith('image/')) readImageFile(file, catId, modelId);
}
function triggerImageUpload(e, catId, modelId) {
  e.stopPropagation();
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = ev => {
    const f = ev.target.files[0];
    if (f) readImageFile(f, catId, modelId);
  };
  input.click();
}
function removeImage(e, catId, modelId) {
  e.stopPropagation();
  const cat = S.categories.find(c => c.id === catId);
  const model = cat?.models.find(m => m.id === modelId);
  if (!model) return;
  model.image = null;
  persist(); render();
}
function readImageFile(file, catId, modelId) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxW = 640;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      // JPEG has no alpha, so transparent pixels would turn black — fill with the image box background first
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--surface-muted').trim() || '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
      const cat = S.categories.find(c => c.id === catId);
      const model = cat?.models.find(m => m.id === modelId);
      if (!model) return;
      model.image = dataUrl;
      persist(); render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

// ── Drag and drop: categories ─────────────────────────────────────────────────
let catDragCtx = null;
function catDragStart(e, catId) {
  catDragCtx = catId;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', catId);
  setTimeout(() => document.querySelector(`.cat-row[data-cat-id="${catId}"]`)?.classList.add('dragging'), 0);
}
function catHeaderDragOver(e) {
  e.preventDefault();
  const rect = e.currentTarget.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height / 2;
  e.currentTarget.classList.toggle('drag-over-top', before);
  e.currentTarget.classList.toggle('drag-over-bottom', !before);
}
function catHeaderDragLeave(e) {
  e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
}
function catHeaderDrop(e, catId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
  if (!catDragCtx || catDragCtx === catId) { catDragCtx = null; return; }
  const rect = e.currentTarget.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height / 2;
  const srcIdx = S.categories.findIndex(c => c.id === catDragCtx);
  if (srcIdx === -1) return;
  const [moved] = S.categories.splice(srcIdx, 1);
  let tgtIdx = S.categories.findIndex(c => c.id === catId);
  if (!before) tgtIdx++;
  S.categories.splice(tgtIdx, 0, moved);
  catDragCtx = null;
  persist(); render();
}

// ── Drag and drop: models ─────────────────────────────────────────────────────
let modelDragCtx = null;
function modelDragStart(e, catId, modelId) {
  modelDragCtx = { catId, modelId };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', modelId);
  setTimeout(() => document.querySelector(`.model-card[data-model-id="${modelId}"]`)?.classList.add('dragging'), 0);
}
function modelCardDragOver(e) {
  e.preventDefault(); e.stopPropagation();
  if (!modelDragCtx) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const before = (e.clientX - rect.left) < rect.width / 2;
  e.currentTarget.classList.toggle('drag-over-left', before);
  e.currentTarget.classList.toggle('drag-over-right', !before);
}
function modelCardDragLeave(e) {
  e.currentTarget.classList.remove('drag-over-left', 'drag-over-right');
}
function modelCardDrop(e, catId, modelId) {
  e.preventDefault(); e.stopPropagation();
  e.currentTarget.classList.remove('drag-over-left', 'drag-over-right');
  if (!modelDragCtx) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const before = (e.clientX - rect.left) < rect.width / 2;
  moveModel(modelDragCtx.catId, modelDragCtx.modelId, catId, modelId, before);
  modelDragCtx = null;
}
function stripDragOver(e) { e.preventDefault(); }
function stripDrop(e, catId) {
  e.preventDefault();
  if (!modelDragCtx) return;
  moveModel(modelDragCtx.catId, modelDragCtx.modelId, catId, null, false);
  modelDragCtx = null;
}
function dragEndCommon() {
  metaDragCtx = null;
  document.querySelectorAll('.dragging,.drag-over-left,.drag-over-right,.drag-over-top,.drag-over-bottom')
    .forEach(el => el.classList.remove('dragging', 'drag-over-left', 'drag-over-right', 'drag-over-top', 'drag-over-bottom'));
}
function moveModel(srcCatId, modelId, targetCatId, targetModelId, before) {
  const srcCat = S.categories.find(c => c.id === srcCatId);
  const model = srcCat?.models.find(m => m.id === modelId);
  if (!model) return;
  srcCat.models = srcCat.models.filter(m => m.id !== modelId);
  const tgtCat = S.categories.find(c => c.id === targetCatId);
  if (!tgtCat) return;
  if (!targetModelId) {
    tgtCat.models.push(model);
  } else {
    const idx = tgtCat.models.findIndex(m => m.id === targetModelId);
    tgtCat.models.splice(before ? idx : idx + 1, 0, model);
  }
  persist(); render();
}

// ── Drag and drop: metadata fields (reorders the shared schema) ───────────────
let metaDragCtx = null;
function metaDragStart(e, catId, fieldId) {
  e.stopPropagation();
  metaDragCtx = { catId, fieldId };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', fieldId);

}
function metaRowDragOver(e, catId) {
  if (!metaDragCtx || metaDragCtx.catId !== catId) return;
  e.preventDefault(); e.stopPropagation();
  const rect = e.currentTarget.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height / 2;
  e.currentTarget.classList.toggle('drag-over-top', before);
  e.currentTarget.classList.toggle('drag-over-bottom', !before);
}
function metaRowDragLeave(e) {
  e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
}
function metaRowDrop(e, catId, fieldId) {
  if (!metaDragCtx || metaDragCtx.catId !== catId) return;
  e.preventDefault(); e.stopPropagation();
  e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
  const srcId = metaDragCtx.fieldId;
  metaDragCtx = null;
  if (srcId === fieldId) return;
  const cat = S.categories.find(c => c.id === catId);
  if (!cat?.metaFields) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height / 2;
  const srcIdx = cat.metaFields.findIndex(f => f.id === srcId);
  if (srcIdx === -1) return;
  const [moved] = cat.metaFields.splice(srcIdx, 1);
  let tgtIdx = cat.metaFields.findIndex(f => f.id === fieldId);
  if (!before) tgtIdx++;
  cat.metaFields.splice(tgtIdx, 0, moved);
  persist(); render();
}

// ── Export / Import ───────────────────────────────────────────────────────────
function exportData() {
  const data = JSON.stringify({ pages: D.pages.map(p => ({ name: p.name, categories: p.categories })) }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `any-compare-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      // Imports are added as new pages, never replacing existing ones.
      // Exports from before pages (a bare categories array) become "Loaded #N".
      let pages;
      if (Array.isArray(parsed.pages)) {
        pages = parsed.pages.map(p => ({ name: typeof p.name === 'string' && p.name.trim() ? p.name.trim() : null, categories: sanitizeCategories(p.categories) }));
      } else if (Array.isArray(parsed.categories)) {
        pages = [{ name: null, categories: sanitizeCategories(parsed.categories) }];
      } else {
        throw new Error('No pages or categories found — is this an Any Compare export?');
      }
      pages.forEach(p => addPage(p.name || nextPageName('Loaded'), p.categories));
      persist(); render();
    } catch (err) {
      alert('Import failed: ' + err.message);
    }
  };
  input.click();
}

// ── Share link ────────────────────────────────────────────────────────────────
// Data travels in ?d=<version>.<base64url>. v1 = deflate-raw compressed JSON,
// v0 = uncompressed JSON for browsers without CompressionStream.
// Images are left out — they'd make the link far too long.
const SHARE_PARAM = 'd';

function toBase64Url(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function fromBase64Url(str) {
  const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '='.repeat((4 - b64.length % 4) % 4));
  return Uint8Array.from(bin, c => c.charCodeAt(0));
}
async function pipeBytes(bytes, stream) {
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
}

async function encodeShare(categories) {
  const json = new TextEncoder().encode(JSON.stringify({ categories }));
  if (typeof CompressionStream === 'function') {
    return '1.' + toBase64Url(await pipeBytes(json, new CompressionStream('deflate-raw')));
  }
  return '0.' + toBase64Url(json);
}
async function decodeShare(param) {
  const dot = param.indexOf('.');
  const ver = param.slice(0, dot), body = fromBase64Url(param.slice(dot + 1));
  let bytes;
  if (ver === '1') bytes = await pipeBytes(body, new DecompressionStream('deflate-raw'));
  else if (ver === '0') bytes = body;
  else throw new Error('Unknown link version');
  const parsed = JSON.parse(new TextDecoder().decode(bytes));
  if (!Array.isArray(parsed.categories)) throw new Error('Missing categories');
  return sanitizeCategories(parsed.categories);
}

// Shared links and imported files are untrusted: ids, widths and images end up
// in HTML attributes unescaped, so validate those strictly.
const SAFE_ID = /^[\w-]{1,32}$/;
const SAFE_IMAGE = /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/;
function sanitizeCategories(cats) {
  const str = v => typeof v === 'string' ? v : '';
  const id = v => { if (typeof v !== 'string' || !SAFE_ID.test(v)) throw new Error('Invalid id in data'); return v; };
  return (Array.isArray(cats) ? cats : []).map(c => {
    const metaFields = (c.metaFields || []).map(f => ({ id: id(f.id), key: str(f.key), ...(['bool', 'sep'].includes(f.type) ? { type: f.type } : {}) }));
    const width = Number(c.cardWidth);
    return {
      id: id(c.id), name: str(c.name),
      ...(width ? { cardWidth: Math.min(CARD_W_MAX, Math.max(CARD_W_MIN, Math.round(width))) } : {}),
      metaFields,
      models: (c.models || []).map(m => {
        const metaValues = {};
        for (const f of metaFields) {
          const v = m.metaValues?.[f.id];
          if (typeof v === 'boolean' || typeof v === 'string') metaValues[f.id] = v;
        }
        return {
          id: id(m.id), brand: str(m.brand), name: str(m.name),
          image: SAFE_IMAGE.test(m.image || '') ? m.image : null,
          metaValues,
          prices: (m.prices || []).map(p => ({ id: id(p.id), price: str(p.price), source: str(p.source) })),
        };
      }),
    };
  });
}

async function shareLink() {
  const btn = document.getElementById('btn-share');
  try {
    const categories = S.categories.map(c => ({ ...c, models: (c.models || []).map(m => ({ ...m, image: null })) }));
    const url = new URL(location.href);
    url.search = '';
    url.hash = '';
    url.searchParams.set(SHARE_PARAM, await encodeShare(categories));
    const link = url.toString();
    try {
      await navigator.clipboard.writeText(link);
      const label = btn.textContent;
      btn.textContent = '✓ Link copied';
      setTimeout(() => { btn.textContent = label; }, 1800);
    } catch (_) {
      prompt('Copy this link:', link);
    }
  } catch (err) {
    alert('Could not create share link: ' + err.message);
  }
}

async function loadFromShareLink() {
  const param = new URLSearchParams(location.search).get(SHARE_PARAM);
  if (!param) return;
  // Drop the param so a reload doesn't add the same page again
  const clean = new URL(location.href);
  clean.searchParams.delete(SHARE_PARAM);
  history.replaceState(null, '', clean);
  try {
    const categories = await decodeShare(param);
    addPage(nextPageName('Share'), categories);
    persist(); render();
  } catch (err) {
    alert('Could not open share link — it may be incomplete or corrupted.');
  }
}

// ── Wire up ───────────────────────────────────────────────────────────────────
document.getElementById('btn-share').addEventListener('click', shareLink);
document.getElementById('btn-export').addEventListener('click', exportData);
document.getElementById('btn-import').addEventListener('click', importData);

hydrate();
render();
loadFromShareLink();
</script>
