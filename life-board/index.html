<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Board</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface-muted: #f8fafc;
  --border: #e2e8f0;
  --text: #1e293b;
  --text-muted: #94a3b8;
  --accent: #4f46e5;
  --accent-light: #eef2ff;
  --col-width: 300px;
  --radius: 8px;
  --green: #10b981;
  --red: #ef4444;
  --amber-bg: #fef3c7;
  --amber-text: #92400e;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── App header ── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px; height: 52px;
  display: flex; align-items: center; gap: 10px;
}
.header h1 { font-size: 16px; font-weight: 700; color: var(--accent); margin-right: auto; }

/* ── Buttons ── */
.btn {
  padding: 6px 13px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-size: 13px; font-family: inherit;
  cursor: pointer; white-space: nowrap; transition: background 0.12s;
}
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: #4338ca; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-icon { padding: 5px 8px; }
.btn-danger { color: var(--red); border-color: #fecaca; }
.btn-danger:hover { background: #fee2e2; }

/* ── Events section ── */
.events-section {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 52px; z-index: 90;
}
.events-hd {
  padding: 5px 20px;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  user-select: none;
}
.events-scroll {
  overflow-x: auto; overflow-y: hidden;
  height: 88px; cursor: crosshair; user-select: none;
  scrollbar-width: none;
}
.events-scroll::-webkit-scrollbar { display: none; }
.events-tl {
  position: relative; height: 88px;
}

/* Full-height day columns — provide hover for the entire column */
.ev-day-col {
  position: absolute; top: 0; width: 20px; height: 88px;
  border-right: 1px solid rgba(0,0,0,0.05);
}
.ev-day-col:hover { background: rgba(79,70,229,0.07); }
.ev-day-num {
  position: absolute; top: 16px; left: 0; right: 0;
  height: 16px; display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: var(--text-muted); pointer-events: none;
}
.ev-day-we { background: rgba(0,0,0,0.04); }
.ev-day-col:hover { background: rgba(79,70,229,0.08); }
.ev-day-ms { border-left: 2px solid #94a3b8; }
.ev-day-today { background: var(--accent-light); }
.ev-day-today .ev-day-num { color: var(--accent); font-weight: 700; }
.ev-day-today:hover { background: rgba(79,70,229,0.12); }

/* Month header overlay (pointer-events:none so hover reaches day cols beneath) */
.ev-months-row {
  position: absolute; top: 0; left: 0; height: 16px;
  pointer-events: none; z-index: 3;
}
.ev-month-span {
  position: absolute; top: 0; height: 16px;
  font-size: 9px; font-weight: 700; letter-spacing: 0.05em;
  color: var(--text-muted); background: rgba(255,255,255,0.85);
  padding: 0 5px; display: flex; align-items: center;
  border-right: 1px solid var(--border);
  white-space: nowrap; overflow: hidden;
}

/* Horizontal divider lines */
.ev-row-divider {
  position: absolute; left: 0; right: 0; height: 1px;
  background: var(--border); pointer-events: none; z-index: 3;
}

/* Today vertical line */
.ev-today {
  position: absolute; top: 32px; bottom: 2px; width: 1px;
  background: var(--accent); opacity: 0.5;
  transform: translateX(-50%); pointer-events: none; z-index: 2;
}

/* Event axis */
.ev-axis {
  position: absolute; top: 70px; left: 0; right: 0;
  height: 1px; background: var(--border); pointer-events: none; z-index: 2;
}

/* Event markers */
.ev-marker {
  position: absolute; top: 0; bottom: 0;
  transform: translateX(-50%); pointer-events: none; z-index: 4;
}
.ev-chip {
  position: absolute; top: 34px; left: 50%; transform: translateX(-50%);
  background: var(--amber-bg); border: 1px solid #fcd34d; border-radius: 4px;
  padding: 2px 5px; font-size: 10px; font-weight: 600; color: var(--amber-text);
  white-space: nowrap; display: flex; align-items: center; gap: 4px;
  pointer-events: auto; cursor: default;
}
.ev-chip-btns { display: none; gap: 2px; }
.ev-marker:hover .ev-chip-btns { display: flex; }
.ev-chip-btn {
  border: none; background: transparent; cursor: pointer;
  color: var(--amber-text); font-size: 10px; padding: 0; line-height: 1; opacity: 0.6;
}
.ev-chip-btn:hover { opacity: 1; }
.ev-vline {
  position: absolute; top: 56px; left: 50%; width: 1px; height: 14px;
  background: #fcd34d; transform: translateX(-50%); pointer-events: none;
}
.ev-dot {
  position: absolute; top: 66px; left: 50%;
  width: 8px; height: 8px; border-radius: 50%;
  background: #f59e0b; border: 2px solid white;
  box-shadow: 0 0 0 1.5px #f59e0b;
  transform: translateX(-50%); pointer-events: auto; cursor: pointer;
}
/* inline event creation input */
.ev-input-wrap {
  position: absolute; top: 36px; transform: translateX(-50%);
  z-index: 10; pointer-events: auto;
}
.ev-name-input {
  border: 1px solid var(--accent); border-radius: 4px;
  padding: 3px 8px; font-size: 11px; font-family: inherit;
  width: 140px; background: white;
  box-shadow: 0 2px 10px rgba(79,70,229,0.2);
}
.ev-name-input:focus { outline: none; }

/* ── Board wrap ── */
.board-wrap { overflow-x: auto; padding: 20px; }
.board {
  display: flex; flex-direction: column; gap: 10px;
  width: calc(3 * var(--col-width) + 2px);
}

/* ── Column header strip ── */
.col-strip {
  display: grid; grid-template-columns: repeat(3, var(--col-width));
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); overflow: hidden;
}
.col-hd {
  padding: 10px 14px; font-size: 11px; font-weight: 700;
  letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted);
  display: flex; align-items: center; gap: 8px;
  border-right: 1px solid var(--border);
}
.col-hd:last-child { border-right: none; }
.col-count {
  background: var(--border); color: var(--text-muted);
  font-size: 11px; padding: 1px 7px; border-radius: 10px; margin-left: auto;
}

/* ── Swimlane ── */
.swimlane {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); overflow: hidden;
}
.swimlane-head {
  padding: 10px 14px 12px;
  background: var(--accent-light); border-bottom: 1px solid #dde4ff;
}
.sl-row { display: flex; align-items: center; gap: 10px; }
.sl-collapse-btn {
  border: none; background: transparent; cursor: pointer;
  color: var(--text-muted); font-size: 11px; padding: 2px 4px;
  border-radius: 3px; line-height: 1; transition: color 0.12s, background 0.12s;
  flex-shrink: 0;
}
.sl-collapse-btn:hover { color: var(--accent); background: var(--bg); }
.sl-name { font-size: 13px; font-weight: 700; color: var(--accent); flex: 1; }
.sl-dl-label { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px; }
.sl-dl-ok     { background: #d1fae5; color: #065f46; }
.sl-dl-warn   { background: #fef3c7; color: #92400e; }
.sl-dl-danger { background: #fee2e2; color: #991b1b; }

/* Epic timeline */
.epic-tl { margin-top: 10px; }
.epic-tl-bar {
  position: relative; height: 6px; border-radius: 3px;
  background: #dde4ff; margin-bottom: 4px;
}
.epic-tl-fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: 3px; width: 100%; }
.epic-tl-fill.ok     { background: #34d399; }
.epic-tl-fill.warn   { background: #fbbf24; }
.epic-tl-fill.danger { background: #f87171; }
.epic-tl-dot {
  position: absolute; top: 50%;
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid white; box-shadow: 0 0 0 1px rgba(0,0,0,0.12);
}
.epic-tl-dot.today    { background: var(--accent); left: 0; transform: translate(-50%,-50%); }
.epic-tl-dot.deadline { background: var(--red);    right: 0; transform: translate(50%,-50%); }
.epic-tl-labels {
  display: flex; justify-content: space-between;
  font-size: 10px; color: #6366f1; opacity: 0.8;
}

/* ── Swimlane body ── */
.swimlane-body { display: grid; grid-template-columns: repeat(3, var(--col-width)); }
.sl-col {
  padding: 10px; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 8px; min-height: 60px;
}
.sl-col:last-child { border-right: none; }

.lane-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-muted); padding: 2px 4px;
}

/* ── Card ── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 11px;
  transition: box-shadow 0.12s, border-color 0.12s;
  cursor: grab;
}
.card:active { cursor: grabbing; }
.card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.07); border-color: #cbd5e1; }
.card.waiting { opacity: 0.6; }
.card.dragging { opacity: 0.35; }

.card-title-row { display: flex; align-items: flex-start; gap: 4px; margin-bottom: 5px; }
.card-title-input {
  flex: 1; min-width: 0; border: none;
  border-bottom: 1px solid transparent;
  font-size: 13px; font-weight: 600; font-family: inherit;
  color: var(--text); background: transparent;
  padding: 0 0 2px; line-height: 1.4; transition: border-color 0.12s;
}
.card-title-input:focus { outline: none; border-bottom-color: var(--accent); }
.card-edit-btn {
  flex-shrink: 0; border: none; background: transparent;
  color: var(--text-muted); cursor: pointer; font-size: 13px;
  padding: 1px 3px; border-radius: 4px; opacity: 0;
  transition: opacity 0.12s, background 0.12s; line-height: 1;
}
.card:hover .card-edit-btn { opacity: 0.5; }
.card-edit-btn:hover { opacity: 1 !important; background: var(--bg); }

.card-notes-input {
  width: 100%; border: none; font-size: 12px; font-family: inherit;
  color: var(--text-muted); background: transparent; padding: 0;
  resize: none; line-height: 1.5; overflow: hidden;
  display: block; min-height: 16px; margin-bottom: 6px;
}
.card-notes-input:focus { outline: none; color: var(--text); }
.card-notes-input::placeholder { color: var(--border); }

.card-meta-row {
  display: flex; align-items: center; gap: 6px;
  flex-wrap: wrap; margin-bottom: 5px;
}
.card-date-input {
  font-size: 11px; font-family: inherit; color: var(--text-muted);
  border: 1px solid transparent; border-radius: 4px;
  padding: 1px 3px; background: transparent; cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
}
.card-date-input:hover { border-color: var(--border); background: var(--bg); }
.card-date-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.card-date-input::-webkit-calendar-picker-indicator { opacity: 0.4; cursor: pointer; }
.card-date-completed { color: var(--green); font-weight: 500; }
.card-date-completed::-webkit-calendar-picker-indicator { opacity: 0.4; cursor: pointer; }
.completed-check { font-size: 11px; font-weight: 700; color: var(--green); flex-shrink: 0; }

/* ── Badges ── */
.badge { font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 4px; }
.badge-blocker { background: var(--amber-bg); color: var(--amber-text); }

/* ── Card timeline strip ── */
.tl-wrap { margin-top: 7px; }
.tl-bar {
  position: relative; height: 6px; border-radius: 3px;
  background: var(--border); margin-bottom: 4px;
}
.tl-zone { position: absolute; top: 0; height: 100%; }
.tl-zone.waiting       { background: #fcd34d; border-radius: 3px 0 0 3px; }
.tl-zone.action-ok     { background: #34d399; }
.tl-zone.action-warn   { background: #fbbf24; }
.tl-zone.action-danger { background: #f87171; }
.tl-zone.full { border-radius: 3px; }
.tl-dot {
  position: absolute; top: 50%;
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.12);
  transform: translateY(-50%);
}
.tl-dot.today    { background: var(--accent); left: 0;  transform: translate(-50%,-50%); }
.tl-dot.blocker  { background: #d97706; }
.tl-dot.deadline { background: var(--red);   right: 0; transform: translate(50%,-50%); }
.tl-labels {
  display: flex; justify-content: space-between;
  font-size: 10px; color: var(--text-muted); padding: 0 2px;
}
.tl-blocker-label { font-size: 10px; color: var(--amber-text); text-align: center; margin-top: 2px; }

/* ── Drag over ── */
.sl-col.drag-over {
  background: var(--accent-light);
  outline: 2px dashed #a5b4fc; outline-offset: -3px;
  border-radius: var(--radius);
}

/* ── Board empty ── */
.board-empty {
  text-align: center; padding: 60px 20px;
  color: var(--text-muted); font-size: 14px;
  width: calc(3 * var(--col-width) + 2px);
}
.board-empty strong { display: block; font-size: 16px; margin-bottom: 6px; color: var(--text); }

/* ── Inline add ── */
.inline-wrap { margin-top: 4px; }
.inline-input {
  width: 100%; padding: 6px 8px;
  border: 1px solid transparent; border-radius: 6px;
  font-size: 13px; font-family: inherit; color: var(--text);
  background: transparent; transition: border-color 0.12s, background 0.12s;
}
.inline-input::placeholder { color: var(--text-muted); opacity: 0.6; }
.inline-input:hover::placeholder { opacity: 1; }
.inline-input:focus {
  outline: none; border-color: var(--accent);
  background: var(--surface); box-shadow: 0 0 0 3px rgba(79,70,229,0.08);
}
.inline-add-epic {
  border: 1px dashed var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 4px 6px;
}
.inline-add-epic .inline-input:focus { background: transparent; box-shadow: none; }

/* ── Modal ── */
.overlay {
  position: fixed; inset: 0; background: rgba(15,23,42,0.4);
  z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal {
  background: var(--surface); border-radius: 12px; padding: 24px;
  width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 24px 64px rgba(0,0,0,0.15);
}
.modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 18px; }
.fg { margin-bottom: 13px; }
.fg label {
  display: block; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-muted); margin-bottom: 5px;
}
.fg input, .fg textarea, .fg select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border);
  border-radius: 6px; font-size: 14px; font-family: inherit;
  color: var(--text); background: var(--surface);
}
.fg input:focus, .fg textarea:focus, .fg select:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,0.08);
}
.fg textarea { resize: vertical; min-height: 72px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-footer {
  display: flex; align-items: center; gap: 8px;
  margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border);
}
.modal-footer .spacer { flex: 1; }
.epic-item {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border: 1px solid var(--border);
  border-radius: 6px; margin-bottom: 6px; font-size: 13px;
}
.epic-item-name { flex: 1; font-weight: 600; }
.epic-item-dl { font-size: 12px; color: var(--text-muted); }
.section-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--text-muted); margin: 16px 0 8px;
}
.hint { font-size: 12px; color: var(--text-muted); line-height: 1.6; margin-bottom: 16px; }
.empty-state { text-align: center; padding: 20px 12px; color: var(--text-muted); font-size: 12px; }

@media (max-width: 600px) {
  .board-wrap { padding: 12px; }
  .form-row { grid-template-columns: 1fr; }
  .header { padding: 0 12px; gap: 6px; }
}
</style>
</head>
<body>

<header class="header">
  <h1>Life Board</h1>
  <button class="btn btn-sm" id="btn-epics">Epics</button>
  <button class="btn btn-sm" id="btn-events">Events</button>
  <button class="btn btn-sm btn-primary" id="btn-add-card">+ Card</button>
  <button class="btn btn-sm btn-icon" id="btn-sync" title="Sync">⇅</button>
  <button class="btn btn-sm btn-icon" id="btn-settings" title="Settings">⚙</button>
</header>

<div id="events-wrap"></div>

<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<div id="modal-root"></div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let S = { epics: [], events: [], settings: { pat: '', gistId: '' } };

const uid      = () => Math.random().toString(36).slice(2, 9);
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function daysDiff(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function shiftDate(d, n) {
  const dt = new Date(d + 'T00:00:00');
  dt.setDate(dt.getDate() + n);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function fmtDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  return `${day}/${m}/${y.slice(2)}`;
}
function daysLabel(d) {
  const n = daysDiff(todayStr(), d);
  if (n < 0)  return `${Math.abs(n)}d overdue`;
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  return `in ${n}d`;
}
function urgency(d) {
  const n = daysDiff(todayStr(), d);
  if (n < 0 || n <= 7) return 'danger';
  if (n <= 21) return 'warn';
  return 'ok';
}

// Resolve blocker info from either new {eventId} or legacy {date,event} format
function getBlockerInfo(card) {
  if (!card.blocker) return null;
  if (card.blocker.eventId) {
    const ev = (S.events||[]).find(e => e.id === card.blocker.eventId);
    return ev ? { date: ev.date, name: ev.name } : null;
  }
  if (card.blocker.date) return { date: card.blocker.date, name: card.blocker.event || '' };
  return null;
}

function isBlocked(card) {
  const b = getBlockerInfo(card);
  return !!(b && daysDiff(todayStr(), b.date) > 0);
}

// ── Persistence ───────────────────────────────────────────────────────────────
function persist() { localStorage.setItem('life-board-v1', JSON.stringify(S)); }
function hydrate() {
  try {
    const r = localStorage.getItem('life-board-v1');
    if (r) { S = JSON.parse(r); S.events = S.events || []; }
  } catch (_) {}
}

// ── GitHub Gist ───────────────────────────────────────────────────────────────
async function gistPush() {
  const { pat, gistId } = S.settings;
  if (!pat) return { ok: false, msg: 'No PAT configured. Go to Settings first.' };
  const content = JSON.stringify({ epics: S.epics, events: S.events }, null, 2);
  const headers = { Authorization: `token ${pat}`, 'Content-Type': 'application/json' };
  try {
    let res;
    if (gistId) {
      res = await fetch(`https://api.github.com/gists/${gistId}`, {
        method: 'PATCH', headers,
        body: JSON.stringify({ files: { 'life-board.json': { content } } })
      });
    } else {
      res = await fetch('https://api.github.com/gists', {
        method: 'POST', headers,
        body: JSON.stringify({ description: 'Life Board', public: false, files: { 'life-board.json': { content } } })
      });
      if (res.ok) { const d = await res.json(); S.settings.gistId = d.id; persist(); return { ok: true, msg: `Created gist ${d.id}` }; }
    }
    return res.ok ? { ok: true, msg: 'Pushed.' } : { ok: false, msg: `API error ${res.status}` };
  } catch (e) { return { ok: false, msg: e.message }; }
}
async function gistPull() {
  const { pat, gistId } = S.settings;
  if (!pat || !gistId) return { ok: false, msg: 'No PAT or Gist ID. Push first to create one.' };
  try {
    const res = await fetch(`https://api.github.com/gists/${gistId}`, { headers: { Authorization: `token ${pat}` } });
    if (!res.ok) return { ok: false, msg: `API error ${res.status}` };
    const d = await res.json();
    const raw = d.files['life-board.json']?.content;
    if (!raw) return { ok: false, msg: 'File not found in gist.' };
    const parsed = JSON.parse(raw);
    S.epics  = parsed.epics  || [];
    S.events = parsed.events || [];
    persist(); render();
    return { ok: true };
  } catch (e) { return { ok: false, msg: e.message }; }
}

// ── Events timeline ───────────────────────────────────────────────────────────
const DAY_PX = 20;
let TL_START = null; // set by renderEventsSection

function renderEventsSection() {
  // Collect all relevant dates to determine range
  const dates = [
    todayStr(),
    ...(S.events||[]).map(e => e.date),
    ...S.epics.flatMap(ep => [
      ep.deadline,
      ...(ep.cards||[]).flatMap(c => {
        const b = getBlockerInfo(c);
        return [c.deadline, b?.date];
      })
    ])
  ].filter(Boolean);

  const minD = dates.reduce((a,b) => a < b ? a : b);
  const maxD = dates.reduce((a,b) => a > b ? a : b);
  TL_START = shiftDate(minD, -14);
  const tlEnd = shiftDate(maxD, 60);
  const totalDays = Math.max(daysDiff(TL_START, tlEnd), 180);
  const W = totalDays * DAY_PX;
  const px = d => daysDiff(TL_START, d) * DAY_PX;
  const today = todayStr();

  // Month spans row
  let monthsHtml = '';
  {
    const cur = new Date(TL_START + 'T00:00:00');
    cur.setDate(1); // start from 1st of TL_START's month
    while (true) {
      const monthStartStr = cur.toISOString().slice(0, 10);
      if (monthStartStr > tlEnd) break;
      const nextMonth = new Date(cur);
      nextMonth.setMonth(nextMonth.getMonth() + 1);
      const monthEndStr = nextMonth.toISOString().slice(0, 10);
      const x = Math.max(0, px(monthStartStr));
      const w = Math.min(W, px(monthEndStr)) - x;
      if (w > 0) {
        const label = cur.toLocaleString('default', { month: 'short' }) + ' \'' + String(cur.getFullYear()).slice(2);
        monthsHtml += `<div class="ev-month-span" style="left:${x}px;width:${w}px">${label}</div>`;
      }
      cur.setMonth(cur.getMonth() + 1);
    }
  }

  // Full-height day columns (local date to avoid UTC off-by-one)
  let dayColsHtml = '';
  for (let i = 0; i < totalDays; i++) {
    const dt = new Date(TL_START + 'T00:00:00');
    dt.setDate(dt.getDate() + i);
    const ds = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    const dow = dt.getDay();
    let cls = 'ev-day-col';
    if (dow === 0 || dow === 6) cls += ' ev-day-we';
    if (dt.getDate() === 1) cls += ' ev-day-ms';
    if (ds === today) cls += ' ev-day-today';
    dayColsHtml += `<div class="${cls}" style="left:${i * DAY_PX}px"><span class="ev-day-num">${dt.getDate()}</span></div>`;
  }

  // Today vertical line (centered on today's cell)
  const todayX = px(today) + DAY_PX / 2;
  const todayHtml = `<div class="ev-today" style="left:${todayX}px"></div>`;

  // Event markers
  const markersHtml = (S.events||[]).map(ev => {
    const x = px(ev.date) + DAY_PX / 2;
    return `<div class="ev-marker" style="left:${x}px" data-ev-id="${ev.id}">
      <div class="ev-chip">
        <span class="ev-name">${esc(ev.name)}</span>
        <span class="ev-chip-btns">
          <button class="ev-chip-btn" onclick="editEvInline('${ev.id}')" title="Rename">✎</button>
          <button class="ev-chip-btn" onclick="deleteEvent('${ev.id}')" title="Delete">×</button>
        </span>
      </div>
      <div class="ev-vline"></div>
      <div class="ev-dot" title="${esc(ev.name)} · ${fmtDate(ev.date)}"></div>
    </div>`;
  }).join('');

  document.getElementById('events-wrap').innerHTML = `
    <div class="events-section">
      <div class="events-hd">Events</div>
      <div class="events-scroll">
        <div class="events-tl" id="events-tl" style="width:${W}px" onclick="evTimelineClick(event)">
          ${dayColsHtml}
          <div class="ev-months-row" style="width:${W}px">${monthsHtml}</div>
          <div class="ev-row-divider" style="top:32px"></div>
          <div class="ev-axis"></div>
          ${todayHtml}
          ${markersHtml}
        </div>
      </div>
    </div>`;

  // Scroll today into view (centered)
  requestAnimationFrame(() => {
    const scroll = document.querySelector('.events-scroll');
    if (scroll) scroll.scrollLeft = Math.max(0, todayX - scroll.clientWidth / 2);
  });
}

// Click on timeline to create event
function evTimelineClick(e) {
  if (e.target.closest('.ev-marker') || e.target.closest('.ev-input-wrap')) return;
  const tl = document.getElementById('events-tl');
  if (!tl) return;
  // Remove existing creation input if any
  tl.querySelector('.ev-input-wrap')?.remove();
  const x = e.clientX - tl.getBoundingClientRect().left;
  const dayIdx = Math.floor(x / DAY_PX);
  const date = shiftDate(TL_START, dayIdx);
  const cellX = dayIdx * DAY_PX + DAY_PX / 2;
  const wrap = document.createElement('div');
  wrap.className = 'ev-input-wrap';
  wrap.style.left = cellX + 'px';
  wrap.innerHTML = `<input class="ev-name-input" placeholder="Event name…" data-date="${date}">`;
  tl.appendChild(wrap);
  const input = wrap.querySelector('input');
  input.focus();
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const name = input.value.trim();
      if (name) { S.events = S.events||[]; S.events.push({ id: uid(), name, date }); persist(); }
      renderEventsSection();
      render(); // update card blockers if any
    } else if (e.key === 'Escape') {
      renderEventsSection();
    }
  });
  input.addEventListener('blur', () => setTimeout(() => wrap.remove(), 150));
}

// Inline rename event
function editEvInline(id) {
  const ev = (S.events||[]).find(e => e.id === id);
  if (!ev) return;
  const nameEl = document.querySelector(`[data-ev-id="${id}"] .ev-name`);
  if (!nameEl) return;
  const input = document.createElement('input');
  input.value = ev.name;
  input.style.cssText = 'width:90px;border:1px solid var(--accent);border-radius:3px;padding:1px 4px;font-size:10px;font-family:inherit;background:white;';
  nameEl.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const save = () => {
    if (done) return; done = true;
    const name = input.value.trim();
    if (name) { ev.name = name; persist(); }
    renderEventsSection();
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
    if (e.key === 'Escape') { done = true; renderEventsSection(); }
  });
  input.addEventListener('blur', save);
}

function deleteEvent(id) {
  if (!confirm('Delete this event? Any cards using it as a blocker will be unblocked.')) return;
  S.events = (S.events||[]).filter(e => e.id !== id);
  S.epics.forEach(ep => (ep.cards||[]).forEach(c => {
    if (c.blocker?.eventId === id) c.blocker = null;
  }));
  persist(); render();
}

// ── Epic timeline ─────────────────────────────────────────────────────────────
function renderEpicTimeline(deadline) {
  const u = urgency(deadline);
  const n = daysDiff(todayStr(), deadline);
  if (n < 0) {
    return `<div class="epic-tl">
      <div class="epic-tl-bar" style="background:#fecaca;">
        <div class="epic-tl-dot today" style="background:var(--red);"></div>
      </div>
      <div class="epic-tl-labels">
        <span style="color:var(--red);font-weight:700;">Overdue ${Math.abs(n)}d</span>
        <span>${fmtDate(deadline)}</span>
      </div>
    </div>`;
  }
  return `<div class="epic-tl">
    <div class="epic-tl-bar">
      <div class="epic-tl-fill ${u}"></div>
      <div class="epic-tl-dot today"></div>
      <div class="epic-tl-dot deadline"></div>
    </div>
    <div class="epic-tl-labels"><span>Today</span><span>${fmtDate(deadline)} · ${daysLabel(deadline)}</span></div>
  </div>`;
}

// ── Card timeline ─────────────────────────────────────────────────────────────
function renderCardTimeline(card) {
  if (!card.deadline) return '';
  const t = todayStr();
  const totalDays = daysDiff(t, card.deadline);

  if (totalDays < 0) {
    return `<div class="tl-wrap">
      <div class="tl-bar" style="background:#fecaca;"><div class="tl-dot today" style="background:var(--red);"></div></div>
      <div class="tl-labels"><span style="color:var(--red);font-weight:600;">Overdue ${Math.abs(totalDays)}d</span><span>${fmtDate(card.deadline)}</span></div>
    </div>`;
  }

  const b = getBlockerInfo(card);
  if (b) {
    const bDiff = daysDiff(t, b.date);
    if (bDiff > 0) {
      const bPct = totalDays > 0 ? Math.min(98, Math.round(bDiff / totalDays * 100)) : 50;
      const actionDays = totalDays - bDiff;
      const aCls = actionDays <= 7 ? 'action-danger' : actionDays <= 14 ? 'action-warn' : 'action-ok';
      return `<div class="tl-wrap">
        <div class="tl-bar">
          <div class="tl-zone waiting" style="left:0;width:${bPct}%;"></div>
          <div class="tl-zone ${aCls}" style="left:${bPct}%;right:0;width:${100-bPct}%;border-radius:${bPct>1?'0 3px 3px 0':'3px'};"></div>
          <div class="tl-dot today"></div>
          <div class="tl-dot blocker" style="left:${bPct}%;transform:translate(-50%,-50%);"></div>
          <div class="tl-dot deadline"></div>
        </div>
        <div class="tl-blocker-label">⏳ ${b.name ? esc(b.name)+' · ' : ''}${fmtDate(b.date)}</div>
        <div class="tl-labels"><span>Today</span><span>${fmtDate(card.deadline)} (${daysLabel(card.deadline)})</span></div>
      </div>`;
    }
  }

  const u = urgency(card.deadline);
  return `<div class="tl-wrap">
    <div class="tl-bar">
      <div class="tl-zone action-${u} full" style="left:0;right:0;width:100%;"></div>
      <div class="tl-dot today"></div>
      <div class="tl-dot deadline"></div>
    </div>
    <div class="tl-labels"><span>Today</span><span>${fmtDate(card.deadline)} (${daysLabel(card.deadline)})</span></div>
  </div>`;
}

// ── Card render ───────────────────────────────────────────────────────────────
function cardHtml(epicId, card) {
  const blocked = isBlocked(card);
  const b = getBlockerInfo(card);
  const blBadge = (b && daysDiff(todayStr(), b.date) > 0)
    ? `<span class="badge badge-blocker">⏳ ${b.name ? esc(b.name)+' · ' : ''}${fmtDate(b.date)}</span>`
    : '';

  const isDone = card.status === 'done';
  const dateField = isDone
    ? `<span class="completed-check">✓</span>
       <input type="date" class="card-date-input card-date-completed" draggable="false" value="${card.completedAt||''}"
         title="Completion date" onchange="saveInlineField('${epicId}','${card.id}','completedAt',this)">`
    : `<input type="date" class="card-date-input" draggable="false" value="${card.deadline||''}"
         title="Due date" onchange="saveInlineField('${epicId}','${card.id}','deadline',this)">`;

  return `<div class="card${blocked?' waiting':''}" data-card-id="${card.id}"
    draggable="true"
    ondragstart="handleDragStart(event,'${epicId}','${card.id}')"
    ondragend="handleDragEnd(event)">
    <div class="card-title-row">
      <input class="card-title-input" draggable="false" value="${esc(card.title)}"
        onblur="saveInlineField('${epicId}','${card.id}','title',this)"
        onkeydown="if(event.key==='Enter')this.blur()">
      <button class="card-edit-btn" draggable="false" onclick="openEditCard('${epicId}','${card.id}')" title="Edit">✎</button>
    </div>
    <textarea class="card-notes-input" draggable="false" placeholder="Add notes…" spellcheck="false"
      onblur="saveInlineField('${epicId}','${card.id}','notes',this)"
      >${esc(card.notes||'')}</textarea>
    <div class="card-meta-row">
      ${dateField}
      ${isDone ? '' : blBadge}
    </div>
    ${isDone ? '' : renderCardTimeline(card)}
  </div>`;
}

// ── Board render ──────────────────────────────────────────────────────────────
function render() {
  renderEventsSection();

  const active = S.epics.filter(e => !e.archived);
  const counts = { todo: 0, doing: 0, done: 0 };
  active.forEach(e => (e.cards||[]).forEach(c => { if (counts[c.status] !== undefined) counts[c.status]++; }));

  const colStrip = `<div class="col-strip">
    <div class="col-hd">Todo <span class="col-count">${counts.todo}</span></div>
    <div class="col-hd">Doing <span class="col-count">${counts.doing}</span></div>
    <div class="col-hd">Done <span class="col-count">${counts.done}</span></div>
  </div>`;

  const inlineEpic = `<div class="inline-add-epic">
    <input class="inline-input" id="inline-epic-input" placeholder="Add epic…" onkeydown="handleInlineEpic(event)">
  </div>`;

  if (!active.length) {
    document.getElementById('board').innerHTML = colStrip + inlineEpic;
    return;
  }

  const swimlanes = active.map(epic => {
    const dlU = epic.deadline ? urgency(epic.deadline) : null;
    const dlBadge = epic.deadline ? `<span class="sl-dl-label sl-dl-${dlU}">${daysLabel(epic.deadline)}</span>` : '';
    const collapseBtn = `<button class="sl-collapse-btn" onclick="toggleEpicCollapse('${epic.id}')" title="${epic.collapsed ? 'Expand' : 'Collapse'}">${epic.collapsed ? '▸' : '▾'}</button>`;
    const head = `<div class="swimlane-head">
      <div class="sl-row">
        ${collapseBtn}
        <span class="sl-name">${esc(epic.name)}</span>
        ${dlBadge}
        <button class="btn btn-sm" onclick="openEditEpic('${epic.id}')">Edit</button>
      </div>
      ${!epic.collapsed && epic.deadline ? renderEpicTimeline(epic.deadline) : ''}
    </div>`;

    if (epic.collapsed) return `<div class="swimlane">${head}</div>`;

    const cols = ['todo','doing','done'].map(status => {
      const cards = (epic.cards||[]).filter(c => c.status === status);
      const ready   = cards.filter(c => !isBlocked(c));
      const waiting = cards.filter(c => isBlocked(c));
      const showLabels = ready.length > 0 && waiting.length > 0;
      return `<div class="sl-col"
        ondragover="handleDragOver(event)"
        ondragleave="handleDragLeave(event)"
        ondrop="handleDrop(event,'${epic.id}','${status}')">
        ${showLabels ? '<div class="lane-label">Ready</div>' : ''}
        ${ready.map(c => cardHtml(epic.id, c)).join('')}
        ${waiting.length ? '<div class="lane-label">Waiting</div>' : ''}
        ${waiting.map(c => cardHtml(epic.id, c)).join('')}
        <div class="inline-wrap">
          <input class="inline-input" data-epic="${epic.id}" data-status="${status}"
            placeholder="Add card…" onkeydown="handleInlineCard(event,'${epic.id}','${status}')">
        </div>
      </div>`;
    }).join('');

    return `<div class="swimlane">${head}<div class="swimlane-body">${cols}</div></div>`;
  }).join('');

  document.getElementById('board').innerHTML = colStrip + swimlanes + inlineEpic;
  requestAnimationFrame(resizeTextareas);
}

// ── Modal helpers ─────────────────────────────────────────────────────────────
function showModal(html) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="overlay" id="_ov">${html}</div>`;
  root.querySelector('#_ov').addEventListener('click', e => { if (e.target.id === '_ov') closeModal(); });
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

// ── Event selector helper ─────────────────────────────────────────────────────
function eventSelectOpts(selectedId) {
  const sorted = [...(S.events||[])].sort((a,b) => a.date < b.date ? -1 : 1);
  const opts = sorted.map(e =>
    `<option value="${e.id}" ${e.id===selectedId?'selected':''}>${esc(e.name)} · ${fmtDate(e.date)}</option>`
  ).join('');
  return `<option value="">— No blocker —</option>${opts}`;
}

// ── Add card ──────────────────────────────────────────────────────────────────
function openAddCard(preEpicId) {
  const opts = S.epics.filter(e=>!e.archived).map(e=>`<option value="${e.id}" ${e.id===preEpicId?'selected':''}>${esc(e.name)}</option>`).join('');
  if (!opts) { alert('Create an epic first (Epics button).'); return; }
  showModal(`<div class="modal">
    <h2>New Card</h2>
    <div class="fg"><label>Epic</label><select id="f-epic">${opts}</select></div>
    <div class="fg"><label>Title</label><input id="f-title" placeholder="What needs doing?" autofocus></div>
    <div class="fg"><label>Notes</label><textarea id="f-notes" placeholder="Optional details..."></textarea></div>
    <div class="fg"><label>Status</label><select id="f-status">
      <option value="todo">Todo</option><option value="doing">Doing</option><option value="done">Done</option>
    </select></div>
    <div class="fg"><label>Deadline</label><input id="f-dl" type="date"></div>
    <div class="fg"><label>Blocked by event</label><select id="f-blocker">${eventSelectOpts('')}</select></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <div class="spacer"></div>
      <button class="btn btn-primary" onclick="_submitCard()">Add Card</button>
    </div>
  </div>`);
}
function _submitCard() {
  const epicId = document.getElementById('f-epic').value;
  const title  = document.getElementById('f-title').value.trim();
  if (!title) { alert('Title is required.'); return; }
  const epic = S.epics.find(e=>e.id===epicId);
  if (!epic) return;
  const eventId = document.getElementById('f-blocker').value;
  epic.cards = epic.cards||[];
  epic.cards.push({
    id: uid(), title,
    notes:    document.getElementById('f-notes').value.trim(),
    status:   document.getElementById('f-status').value,
    deadline: document.getElementById('f-dl').value || null,
    blocker:  eventId ? { eventId } : null
  });
  persist(); render(); closeModal();
}

// ── Edit card ─────────────────────────────────────────────────────────────────
function openEditCard(epicId, cardId) {
  const epic = S.epics.find(e=>e.id===epicId);
  const card = epic?.cards.find(c=>c.id===cardId);
  if (!card) return;
  const curEventId = card.blocker?.eventId || '';
  showModal(`<div class="modal">
    <h2>Edit Card</h2>
    <div class="fg"><label>Title</label><input id="f-title" value="${esc(card.title)}" autofocus></div>
    <div class="fg"><label>Notes</label><textarea id="f-notes">${esc(card.notes||'')}</textarea></div>
    <div class="fg"><label>Status</label><select id="f-status">
      <option value="todo" ${card.status==='todo'?'selected':''}>Todo</option>
      <option value="doing" ${card.status==='doing'?'selected':''}>Doing</option>
      <option value="done" ${card.status==='done'?'selected':''}>Done</option>
    </select></div>
    <div class="fg"><label>Deadline</label><input id="f-dl" type="date" value="${card.deadline||''}"></div>
    <div class="fg"><label>Completion Date</label><input id="f-ca" type="date" value="${card.completedAt||''}"></div>
    <div class="fg"><label>Blocked by event</label><select id="f-blocker">${eventSelectOpts(curEventId)}</select></div>
    <div class="modal-footer">
      <button class="btn btn-danger" onclick="_deleteCard('${epicId}','${cardId}')">Delete</button>
      <div class="spacer"></div>
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="_saveCard('${epicId}','${cardId}')">Save</button>
    </div>
  </div>`);
}
function _saveCard(epicId, cardId) {
  const epic = S.epics.find(e=>e.id===epicId);
  const card = epic?.cards.find(c=>c.id===cardId);
  if (!card) return;
  const title = document.getElementById('f-title').value.trim();
  if (!title) { alert('Title is required.'); return; }
  const eventId = document.getElementById('f-blocker').value;
  const newStatus = document.getElementById('f-status').value;
  const caVal = document.getElementById('f-ca').value;
  card.title    = title;
  card.notes    = document.getElementById('f-notes').value.trim();
  card.status   = newStatus;
  card.deadline = document.getElementById('f-dl').value || null;
  card.blocker  = eventId ? { eventId } : null;
  card.completedAt = newStatus === 'done' ? (caVal || card.completedAt || todayStr()) : null;
  persist(); render(); closeModal();
}
function _deleteCard(epicId, cardId) {
  if (!confirm('Delete this card?')) return;
  const epic = S.epics.find(e=>e.id===epicId);
  if (!epic) return;
  epic.cards = epic.cards.filter(c=>c.id!==cardId);
  persist(); render(); closeModal();
}

// ── Move card ─────────────────────────────────────────────────────────────────
function moveCard(epicId, cardId, dir) {
  const epic = S.epics.find(e=>e.id===epicId);
  const card = epic?.cards.find(c=>c.id===cardId);
  if (!card) return;
  const order = ['todo','doing','done'];
  const idx = order.indexOf(card.status) + dir;
  if (idx < 0 || idx >= order.length) return;
  card.status = order[idx];
  persist(); render();
}

// ── Drag and drop ─────────────────────────────────────────────────────────────
function handleDragStart(e, epicId, cardId) {
  e.dataTransfer.setData('application/json', JSON.stringify({epicId, cardId}));
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => { document.querySelector(`[data-card-id="${cardId}"]`)?.classList.add('dragging'); }, 0);
}
function handleDragEnd() {
  document.querySelectorAll('.dragging,.drag-over').forEach(el => el.classList.remove('dragging','drag-over'));
}
function handleDragOver(e) {
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}
function handleDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('drag-over');
}
function handleDrop(e, targetEpicId, targetStatus) {
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  let payload; try { payload = JSON.parse(e.dataTransfer.getData('application/json')); } catch { return; }
  const { epicId, cardId } = payload;
  const srcEpic = S.epics.find(ep => ep.id === epicId);
  const card = srcEpic?.cards.find(c => c.id === cardId);
  if (!card) return;
  if (epicId === targetEpicId && card.status === targetStatus) return;
  if (targetStatus === 'done' && card.status !== 'done') {
    _askCompletionDate(card.title, epicId, cardId, targetEpicId, targetStatus);
  } else {
    _executeMove(epicId, cardId, targetEpicId, targetStatus, targetStatus === 'done' ? card.completedAt : null);
  }
}
function _executeMove(epicId, cardId, targetEpicId, targetStatus, completedAt) {
  const srcEpic = S.epics.find(ep => ep.id === epicId);
  const card = srcEpic?.cards.find(c => c.id === cardId);
  if (!card) return;
  card.status = targetStatus;
  card.completedAt = targetStatus === 'done' ? (completedAt || null) : null;
  if (epicId !== targetEpicId) {
    srcEpic.cards = srcEpic.cards.filter(c => c.id !== cardId);
    const tgt = S.epics.find(ep => ep.id === targetEpicId);
    if (tgt) { tgt.cards = tgt.cards || []; tgt.cards.push(card); }
  }
  persist(); render();
}
function _askCompletionDate(title, epicId, cardId, targetEpicId, targetStatus) {
  showModal(`<div class="modal">
    <h2>Mark as Done</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">${esc(title)}</p>
    <div class="fg"><label>Completion Date</label><input id="f-ca" type="date" value="${todayStr()}" autofocus></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal();_executeMove('${epicId}','${cardId}','${targetEpicId}','${targetStatus}',null)">Skip</button>
      <div class="spacer"></div>
      <button class="btn btn-primary" onclick="_confirmCompletionDate('${epicId}','${cardId}','${targetEpicId}','${targetStatus}')">Confirm</button>
    </div>
  </div>`);
}
function _confirmCompletionDate(epicId, cardId, targetEpicId, targetStatus) {
  const date = document.getElementById('f-ca').value || todayStr();
  closeModal();
  _executeMove(epicId, cardId, targetEpicId, targetStatus, date);
}

// ── Inline field save ─────────────────────────────────────────────────────────
function saveInlineField(epicId, cardId, field, el) {
  const epic = S.epics.find(e => e.id === epicId);
  const card = epic?.cards.find(c => c.id === cardId);
  if (!card) return;
  let val;
  if (field === 'deadline' || field === 'completedAt') { val = el.value || null; }
  else if (field === 'notes')  { val = el.value.trim() || null; }
  else { val = el.value.trim(); if (!val) { el.value = card.title; return; } }
  if (card[field] === val) return;
  card[field] = val;
  persist(); render();
}

function resizeTextareas() {
  document.querySelectorAll('.card-notes-input').forEach(ta => {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  });
}

// ── Inline add handlers ───────────────────────────────────────────────────────
function handleInlineCard(e, epicId, status) {
  if (e.key === 'Enter') {
    const title = e.target.value.trim();
    if (!title) return;
    const epic = S.epics.find(ep => ep.id === epicId);
    if (!epic) return;
    epic.cards = epic.cards || [];
    epic.cards.push({ id: uid(), title, notes: '', status, deadline: null, blocker: null, completedAt: status === 'done' ? todayStr() : null });
    persist(); render();
    document.querySelector(`.inline-input[data-epic="${epicId}"][data-status="${status}"]`)?.focus();
  } else if (e.key === 'Escape') {
    e.target.value = ''; e.target.blur();
  }
}
function handleInlineEpic(e) {
  if (e.key === 'Enter') {
    const title = e.target.value.trim();
    if (!title) return;
    S.epics.push({ id: uid(), name: title, deadline: null, archived: false, cards: [] });
    persist(); render();
    document.getElementById('inline-epic-input')?.focus();
  } else if (e.key === 'Escape') {
    e.target.value = ''; e.target.blur();
  }
}

// ── Events modal ──────────────────────────────────────────────────────────────
function openEventsModal() {
  const sorted = [...(S.events||[])].sort((a,b) => a.date < b.date ? -1 : 1);
  const rows = sorted.map(ev => `<div class="epic-item" id="ev-row-${ev.id}">
    <span class="epic-item-name">${esc(ev.name)}</span>
    <span class="epic-item-dl">${fmtDate(ev.date)}</span>
    <button class="btn btn-sm" onclick="_renameEventModal('${ev.id}')">Rename</button>
    <button class="btn btn-sm btn-danger" onclick="_deleteEventModal('${ev.id}')">Delete</button>
  </div>`).join('');
  showModal(`<div class="modal">
    <h2>Events</h2>
    ${rows || '<div class="empty-state">No events yet. Click the timeline to add one.</div>'}
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="_addEventModal()">+ New Event</button>
      <div class="spacer"></div>
      <button class="btn" onclick="closeModal()">Close</button>
    </div>
  </div>`);
}
function _addEventModal() {
  showModal(`<div class="modal">
    <h2>New Event</h2>
    <div class="fg"><label>Name</label><input id="f-evname" placeholder="e.g. Moving day" autofocus></div>
    <div class="fg"><label>Date</label><input id="f-evdate" type="date" value="${todayStr()}"></div>
    <div class="modal-footer">
      <button class="btn" onclick="openEventsModal()">Back</button>
      <div class="spacer"></div>
      <button class="btn btn-primary" onclick="_submitEventModal()">Add</button>
    </div>
  </div>`);
}
function _submitEventModal() {
  const name = document.getElementById('f-evname').value.trim();
  const date = document.getElementById('f-evdate').value;
  if (!name) { alert('Name is required.'); return; }
  if (!date) { alert('Date is required.'); return; }
  S.events = S.events || [];
  S.events.push({ id: uid(), name, date });
  persist(); render(); openEventsModal();
}
function _renameEventModal(id) {
  const ev = (S.events||[]).find(e => e.id === id);
  if (!ev) return;
  showModal(`<div class="modal">
    <h2>Edit Event</h2>
    <div class="fg"><label>Name</label><input id="f-evname" value="${esc(ev.name)}" autofocus></div>
    <div class="fg"><label>Date</label><input id="f-evdate" type="date" value="${ev.date}"></div>
    <div class="modal-footer">
      <button class="btn" onclick="openEventsModal()">Back</button>
      <div class="spacer"></div>
      <button class="btn btn-primary" onclick="_saveEventModal('${id}')">Save</button>
    </div>
  </div>`);
}
function _saveEventModal(id) {
  const ev = (S.events||[]).find(e => e.id === id);
  if (!ev) return;
  const name = document.getElementById('f-evname').value.trim();
  const date = document.getElementById('f-evdate').value;
  if (!name) { alert('Name is required.'); return; }
  if (!date) { alert('Date is required.'); return; }
  ev.name = name; ev.date = date;
  persist(); render(); openEventsModal();
}
function _deleteEventModal(id) {
  const ev = (S.events||[]).find(e => e.id === id);
  if (!ev) return;
  if (!confirm(`Delete "${ev.name}"? Cards using it as a blocker will be unblocked.`)) return;
  S.events = S.events.filter(e => e.id !== id);
  S.epics.forEach(ep => (ep.cards||[]).forEach(c => {
    if (c.blocker?.eventId === id) c.blocker = null;
  }));
  persist(); render(); openEventsModal();
}

// ── Epics ─────────────────────────────────────────────────────────────────────
function openEpics() {
  const active = S.epics.filter(e=>!e.archived);
  const archived = S.epics.filter(e=>e.archived);
  const row = e => `<div class="epic-item">
    <span class="epic-item-name">${esc(e.name)}</span>
    <span class="epic-item-dl">${e.deadline?fmtDate(e.deadline):''}</span>
    <button class="btn btn-sm" onclick="openEditEpic('${e.id}')">Edit</button>
    ${!e.archived
      ? `<button class="btn btn-sm" onclick="_archiveEpic('${e.id}')">Archive</button>`
      : `<button class="btn btn-sm" onclick="_restoreEpic('${e.id}')">Restore</button>`}
  </div>`;
  showModal(`<div class="modal">
    <h2>Epics</h2>
    ${active.map(row).join('') || '<div class="empty-state">No active epics yet.</div>'}
    ${archived.length ? `<div class="section-title">Archived</div>${archived.map(row).join('')}` : ''}
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="openAddEpic()">+ New Epic</button>
      <div class="spacer"></div>
      <button class="btn" onclick="closeModal()">Close</button>
    </div>
  </div>`);
}
function openAddEpic() {
  showModal(`<div class="modal">
    <h2>New Epic</h2>
    <div class="fg"><label>Name</label><input id="f-en" placeholder="e.g. Move to new city" autofocus></div>
    <div class="fg"><label>Deadline</label><input id="f-ed" type="date"></div>
    <div class="modal-footer">
      <button class="btn" onclick="openEpics()">Back</button>
      <div class="spacer"></div>
      <button class="btn btn-primary" onclick="_submitEpic()">Create</button>
    </div>
  </div>`);
}
function _submitEpic() {
  const name = document.getElementById('f-en').value.trim();
  if (!name) { alert('Name is required.'); return; }
  S.epics.push({ id: uid(), name, deadline: document.getElementById('f-ed').value||null, archived: false, cards: [] });
  persist(); render(); openEpics();
}
function openEditEpic(epicId) {
  const e = S.epics.find(ep=>ep.id===epicId);
  if (!e) return;
  showModal(`<div class="modal">
    <h2>Edit Epic</h2>
    <div class="fg"><label>Name</label><input id="f-en" value="${esc(e.name)}" autofocus></div>
    <div class="fg"><label>Deadline</label><input id="f-ed" type="date" value="${e.deadline||''}"></div>
    <div class="modal-footer">
      <button class="btn btn-danger" onclick="_deleteEpic('${epicId}')">Delete</button>
      <div class="spacer"></div>
      <button class="btn" onclick="openEpics()">Back</button>
      <button class="btn btn-primary" onclick="_saveEpic('${epicId}')">Save</button>
    </div>
  </div>`);
}
function _saveEpic(epicId) {
  const e = S.epics.find(ep=>ep.id===epicId);
  if (!e) return;
  const name = document.getElementById('f-en').value.trim();
  if (!name) { alert('Name is required.'); return; }
  e.name = name; e.deadline = document.getElementById('f-ed').value || null;
  persist(); render(); closeModal();
}
function _deleteEpic(epicId) {
  const e = S.epics.find(ep=>ep.id===epicId);
  if (!e) return;
  const n = (e.cards||[]).length;
  if (!confirm(`Delete "${e.name}"${n?` and its ${n} card(s)`:''}?`)) return;
  S.epics = S.epics.filter(ep=>ep.id!==epicId);
  persist(); render(); closeModal();
}
function toggleEpicCollapse(epicId) {
  const e = S.epics.find(ep => ep.id === epicId);
  if (e) { e.collapsed = !e.collapsed; persist(); render(); }
}
function _archiveEpic(epicId) {
  const e = S.epics.find(ep=>ep.id===epicId);
  if (e) { e.archived = true; persist(); render(); openEpics(); }
}
function _restoreEpic(epicId) {
  const e = S.epics.find(ep=>ep.id===epicId);
  if (e) { e.archived = false; persist(); render(); openEpics(); }
}

// ── Settings & Sync ───────────────────────────────────────────────────────────
function openSettings() {
  showModal(`<div class="modal">
    <h2>Settings — Gist Sync</h2>
    <p class="hint">Create a GitHub Personal Access Token with <strong>gist</strong> scope. Stored only in your browser's localStorage.</p>
    <div class="fg"><label>Personal Access Token</label><input id="f-pat" type="password" value="${esc(S.settings.pat||'')}" placeholder="ghp_..."></div>
    <div class="fg"><label>Gist ID <span style="font-weight:400;text-transform:none;">(auto-created on first push)</span></label>
      <input id="f-gid" value="${esc(S.settings.gistId||'')}" placeholder="leave blank to create new"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <div class="spacer"></div>
      <button class="btn btn-primary" onclick="_saveSettings()">Save</button>
    </div>
  </div>`);
}
function _saveSettings() {
  S.settings.pat = document.getElementById('f-pat').value.trim();
  S.settings.gistId = document.getElementById('f-gid').value.trim();
  persist(); closeModal();
}
function openSync() {
  showModal(`<div class="modal">
    <h2>Sync & Export</h2>
    <div class="section-title">Local File</div>
    <p class="hint">Export all data to a JSON file, or restore from a previously exported file.</p>
    <div style="display:flex;gap:8px;margin-bottom:4px;">
      <button class="btn" onclick="exportData()">↓ Export JSON</button>
      <button class="btn" onclick="importData()">↑ Import JSON</button>
    </div>
    <div class="section-title" style="margin-top:20px;">GitHub Gist</div>
    <p class="hint">Push sends your data to GitHub Gist. Pull replaces local data with the Gist version. Configure your PAT in Settings first.</p>
    <div id="sync-msg" style="font-size:13px;min-height:20px;"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Close</button>
      <div class="spacer"></div>
      <button class="btn" onclick="_doPull()">↓ Pull</button>
      <button class="btn btn-primary" onclick="_doPush()">↑ Push</button>
    </div>
  </div>`);
}
function exportData() {
  const data = JSON.stringify({ epics: S.epics, events: S.events }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `life-board-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!Array.isArray(parsed.epics)) throw new Error('Missing epics array — is this a Life Board export?');
      if (!confirm(`Import "${file.name}"? This will replace all current data.`)) return;
      S.epics  = parsed.epics  || [];
      S.events = parsed.events || [];
      persist(); render(); closeModal();
    } catch (err) {
      alert('Import failed: ' + err.message);
    }
  };
  input.click();
}
function _syncMsg(msg, ok) {
  const el = document.getElementById('sync-msg');
  if (el) el.innerHTML = `<span style="color:${ok?'var(--green)':'var(--red)'}">${esc(msg)}</span>`;
}
async function _doPush() { _syncMsg('Pushing…', true); const r = await gistPush(); _syncMsg(r.ok?(r.msg||'Pushed.'):'Error: '+r.msg, r.ok); }
async function _doPull() { _syncMsg('Pulling…', true); const r = await gistPull(); _syncMsg(r.ok?'Pulled successfully.':'Error: '+r.msg, r.ok); }

// ── Wire up ───────────────────────────────────────────────────────────────────
document.getElementById('btn-epics').addEventListener('click', openEpics);
document.getElementById('btn-events').addEventListener('click', openEventsModal);
document.getElementById('btn-add-card').addEventListener('click', () => openAddCard());
document.getElementById('btn-sync').addEventListener('click', openSync);
document.getElementById('btn-settings').addEventListener('click', openSettings);

hydrate();
render();
</script>
</body>
</html>
